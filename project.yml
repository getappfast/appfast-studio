name: MobileStudio
options:
  bundleIdPrefix: app.fast
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MobileStudio:
    type: application
    platform: macOS
    sources:
      - path: MobileStudio
        excludes:
          - Resources/Templates/**
          - Resources/Design/**
      # A folder reference keeps the starter's directory layout inside the app bundle.
      - path: MobileStudio/Resources/Templates
        type: folder
      # The design kit, icon font, font catalog and styles, as one folder for the same reason.
      - path: MobileStudio/Resources/Design
        type: folder
    info:
      path: MobileStudio/Info.plist
      properties:
        CFBundleDisplayName: AppFast Studio
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    entitlements:
      path: MobileStudio/MobileStudio.entitlements
      properties: {}   # not sandboxed: the app has to launch the user's claude CLI
    dependencies:
      - sdk: IOSurface.framework
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: MobileStudio/MobileStudio-Bridging-Header.h
        PRODUCT_BUNDLE_IDENTIFIER: app.fast.studio
        PRODUCT_NAME: AppFast Studio
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    scheme:
      testTargets:
        - MobileStudioTests
  MobileStudioTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - MobileStudioTests
    dependencies:
      - target: MobileStudio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.fast.studio.tests
        # The app's product name has a space, so the default test host path doesn't exist.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AppFast Studio.app/Contents/MacOS/AppFast Studio"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
