<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="ms-screen" content="Sample">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="kit.css">
</head>
<body>
<div class="screen with-nav">
  <div class="app-bar large">
    <span class="app-bar-title">Good morning</span>
    <span class="spacer"></span>
    <span class="icon-button"><span class="icon">search</span></span>
    <span class="avatar">A</span>
  </div>
  <div class="column gap-2 pad-x-2">
    <div class="card column gap-2">
      <div class="row space-between">
        <span class="title-medium">This week</span>
        <span class="label-medium text-variant">4 of 7 days</span>
      </div>
      <div class="progress" style="--value: 57%"></div>
      <span class="body-medium text-variant">Three more days to reach your goal.</span>
    </div>
    <div class="row gap-1 wrap">
      <span class="chip selected"><span class="icon small">check</span>All</span>
      <span class="chip">Morning</span>
      <span class="chip">Evening</span>
    </div>
    <div class="list">
      <div class="list-tile">
        <span class="avatar"><span class="icon">water_drop</span></span>
        <div class="column grow">
          <span class="list-tile-title">Drink water</span>
          <span class="list-tile-subtitle">6 of 8 glasses</span>
        </div>
        <span class="checkbox on"></span>
      </div>
      <div class="divider"></div>
      <div class="list-tile">
        <span class="avatar"><span class="icon">directions_walk</span></span>
        <div class="column grow">
          <span class="list-tile-title">Walk</span>
          <span class="list-tile-subtitle">20 minutes</span>
        </div>
        <span class="checkbox"></span>
      </div>
    </div>
    <div class="row gap-1">
      <span class="button filled grow">Start</span>
      <span class="button outlined grow">Later</span>
    </div>
  </div>
  <span class="fab"><span class="icon">add</span></span>
  <div class="nav-bar">
    <div class="nav-item selected"><span class="icon">today</span>Today</div>
    <div class="nav-item"><span class="icon">insights</span>Progress</div>
    <div class="nav-item"><span class="icon">settings</span>Settings</div>
  </div>
</div>
</body>
</html>
